name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Create test environment file
      run: |
        echo "NODE_ENV=test" > ./packages/server/.env.test
        echo "SPOTIFY_CLIENT_ID=test_spotify_client_id" >> ./packages/server/.env.test
        echo "SPOTIFY_CLIENT_SECRET=test_spotify_client_secret" >> ./packages/server/.env.test
        echo "SPOTIFY_REDIRECT_URI=http://localhost:3000/callback" >> ./packages/server/.env.test
        echo "OPENAI_API_KEY=test_openai_api_key" >> ./packages/server/.env.test
        echo "JWT_SECRET=test_jwt_secret" >> ./packages/server/.env.test
        echo "CLIENT_URL=http://localhost:5173" >> ./packages/server/.env.test
        echo "DOMAIN=localhost" >> ./packages/server/.env.test
        echo "PORT=3001" >> ./packages/server/.env.test
    
    - name: Run tests
      run: npm test
    
    - name: Generate coverage report
      run: npm run test:server:coverage
    
    - name: Upload coverage report
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: packages/server/coverage/